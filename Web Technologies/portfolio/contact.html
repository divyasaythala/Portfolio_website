<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #020202, #090909);
      color: #ffffff;
    }

    header {
      background-color: #a50a0a;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .contact-section {
      padding: 60px 20px;
      text-align: center;
    }

    .contact-section h2 {
      color: #a50a0a;
      font-size: 28px;
      margin-bottom: 15px;
    }

    .contact-section p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      list-style: none;
      padding: 0;
    }

    .contact-item {
      background: white;
      border-radius: 12px;
      padding: 15px 25px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 15px;
      transition: transform 0.3s, box-shadow 0.3s;
      width: 320px;
      justify-content: center;
    }

    .contact-item:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 10px 18px rgba(0,0,0,0.2);
    }

    .contact-item a {
      text-decoration: none;
      color: #000000;
      font-weight: 600;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .contact-item a:hover {
      color: #a50a0a;
      text-shadow: 0 0 8px rgba(165,10,10,0.4);
    }

    .emoji {
      font-size: 26px;
    }
  </style>
</head>
<body>
  <header>Contact Me</header>
  <div class="contact-section">
    <h2>✨ Get in Touch ✨</h2>
    <p>I'd love to hear from you! Reach out through any of these channels:</p>
    <ul class="contact-list">
      <li class="contact-item">
        <span class="emoji">📧</span>
        <a href="mailto:divyasrisaythala@gmail.com">divyasrisaythala@gmail.com</a>
      </li>
      <li class="contact-item">
        <span class="emoji">📱</span>
        <span style="color: black;"><b>+91 8309990972</b></span>
      </li>
      <li class="contact-item">
        <span class="emoji">💼</span>
        <a href="https://www.linkedin.com/in/divyasri-saythala-3402a7323" target="_blank">LinkedIn Profile</a>
      </li>
    </ul>
  </div>
</body>
</html>
