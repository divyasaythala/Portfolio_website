<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profiles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #050404, #0a0a0a);
    }

    header {
      background-color: #a50a0a;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .profiles-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      padding: 50px;
    }

    .profile-card {
      background: rgb(236, 235, 232);
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .profile-card:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 12px 20px rgba(0,0,0,0.2);
    }

    .profile-card img {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
      transition: transform 0.3s;
    }

    .profile-card:hover img {
      transform: rotate(10deg) scale(1.2);
    }

    .profile-card h2 {
      color: #a50a0a;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .profile-card a {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, #a50a0a, #880808);
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.3s, transform 0.2s;
    }

    .profile-card a:hover {
      background: linear-gradient(135deg, #ff6f61, #a50a0a);
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <header>Profiles</header>
  <div class="profiles-container">
    <div class="profile-card">
      <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub Logo">
      <h2>GitHub</h2>
      <a href="https://github.com/divyasaythala" target="_blank">Visit Profile</a>
    </div>
    <div class="profile-card">
      <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn Logo">
      <h2>LinkedIn</h2>
      <a href="https://www.linkedin.com/in/divyasri-saythala-3402a7323" target="_blank">Visit Profile</a>
    </div>
    <div class="profile-card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/LeetCode_logo_black.png" alt="LeetCode Logo">
      <h2>LeetCode</h2>
      <a href="https://leetcode.com/u/23r01a6651/" target="_blank">Visit Profile</a>
    </div>
    <div class="profile-card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/43/GeeksforGeeks.svg" alt="GeeksforGeeks Logo">
      <h2>GeeksforGeeks</h2>
      <a href="https://www.geeksforgeeks.org/profile/23r01a6651" target="_blank">Visit Profile</a>
    </div>
    <div class="profile-card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/65/HackerRank_logo.png" alt="HackerRank Logo">
      <h2>HackerRank</h2>
      <a href="https://www.hackerrank.com/profile/23r01a6651" target="_blank">Visit Profile</a>
    </div>
  </div>
</body>
</html>
